name: Privacy, rights, or takedown notice
description: Submit a public-safe notice about privacy, licensing, attribution, or removal.
title: "[Privacy or rights]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include personal data, confidential records, identity documents, private correspondence, credentials, or sensitive security details. Use the private security-reporting route for exposed data, leaked secrets, or vulnerabilities.

  - type: dropdown
    id: notice_type
    attributes:
      label: Notice type
      options:
        - Privacy or personal-data concern
        - Copyright or licensing
        - Attribution
        - Takedown or removal
        - Other rights concern
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Public location
      description: Identify only the public repository path or URL at issue.
      placeholder: docs/example.md or a public repository URL
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Requested outcome
      description: State the correction, attribution, restriction, or removal requested without including sensitive evidence.
    validations:
      required: true

  - type: textarea
    id: public_references
    attributes:
      label: Public supporting references
      description: Include only public, non-sensitive references. Request private coordination if additional evidence is necessary.

  - type: checkboxes
    id: safety
    attributes:
      label: Public-safe notice
      options:
        - label: I have not included personal data, confidential records, credentials, identity documents, private correspondence, or sensitive security details.
          required: true
