name: Validate documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate repository documentation structure
        run: python scripts/check_docs.py

      - name: Verify dependency lock policy
        run: python scripts/check_requirements_lock.py

      - name: Test repository security validators
        run: |
          reference_files=()
          while IFS= read -r reference_file; do
            [[ -n "${reference_file}" ]] && reference_files+=("${reference_file}")
          done < scripts/reference_source_files.txt
          test "${#reference_files[@]}" -gt 0
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/check_reference_urls.py "${reference_files[@]}"

      - name: Install verified dependency resolver
        env:
          GITHUB_TOKEN: ""
        run: |
          scripts/install_verified_uv.sh "${RUNNER_TEMP}/verified-uv/bin"

      - name: Reproduce dependency lock
        run: |
          env -i \
            PATH="${RUNNER_TEMP}/verified-uv/bin:/usr/local/bin:/usr/bin:/bin" \
            HOME="${RUNNER_TEMP}/verified-uv/home" \
            RUNNER_TEMP="${RUNNER_TEMP}" \
            scripts/reproduce_requirements_lock.sh

      - name: Install documentation dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements.txt

      - name: Build documentation
        run: python -m mkdocs build --strict

      # External URLs are intentionally skipped to keep pull-request checks deterministic.
      - name: Install verified Lychee
        env:
          GITHUB_TOKEN: ""
        run: |
          scripts/install_verified_lychee.sh "${RUNNER_TEMP}/verified-lychee/bin"

      - name: Validate local Markdown links
        run: |
          extracted_links="${RUNNER_TEMP}/lychee-local-links.txt"
          env -i \
            PATH="${RUNNER_TEMP}/verified-lychee/bin:/usr/local/bin:/usr/bin:/bin" \
            HOME="${RUNNER_TEMP}/verified-lychee/home" \
            lychee \
              --dump \
              --offline \
              --root-dir "${GITHUB_WORKSPACE}" \
              './**/*.md' > "${extracted_links}"
          if [[ ! -s "${extracted_links}" ]]; then
            echo "Lychee extracted zero local links; refusing a vacuous pass." >&2
            exit 1
          fi
          echo "Lychee extracted $(wc -l < "${extracted_links}") local links."
          env -i \
            PATH="${RUNNER_TEMP}/verified-lychee/bin:/usr/local/bin:/usr/bin:/bin" \
            HOME="${RUNNER_TEMP}/verified-lychee/home" \
            lychee \
              --no-progress \
              --offline \
              --root-dir "${GITHUB_WORKSPACE}" \
              './**/*.md'
